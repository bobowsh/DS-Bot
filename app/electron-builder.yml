# The app id names the Windows uninstall entry and the single-instance lock: it is a technical
# identifier, not a name the user sees, so it stays as it is.
appId: io.github.fei2411.deepseekbot
productName: LinkBot
copyright: Copyright 2026 Fei2411 and the DS Bot contributors
artifactName: LinkBot-${version}-${os}-${arch}.${ext}
directories:
  output: dist-pack
files:
  - package.json
  - src/**
  - assets/**
# The Host runs pnpm as a separate Node process to install plugins, and the Office payload's
# plain Node runs the LibreOffice Kit CLI: both must be plain files outside the asar.
asarUnpack:
  - node_modules/pnpm/**
  - node_modules/@deepseek-ai/libreoffice-kit/**
  # The payload Node cannot read office.js through the asar.
  - node_modules/ds-bot/office.js
  # Automatic unpacking misses versioned Linux libraries such as libvips-cpp.so.8.18.7.
  - node_modules/@img/sharp*/**
# The Office payload that scripts/prepare-runtime.mjs writes in beforePack (see package.json's
# `runtime` script). build/ is not in `files`, so nothing of it lands inside the asar.
extraResources:
  - from: build/runtime/primary-runtime
    to: primary-runtime
  - from: build/runtime/office-skills
    to: office-skills
  # The factory seed team and the bundled skills repo travel as plain directories under the
  # app's resources, which is where the running app reads them from (src/factory.mjs uses
  # process.resourcesPath). Both stay outside the asar: the skills repo is a git repository,
  # and nothing reads a git dir through the archive.
  - from: resources/factory
    to: factory
  - from: resources/skills-repo
    to: skills-repo
# node-pty, sharp and koffi ship prebuilt binaries for each platform. A rebuild would compile
# node-pty from source and needs a C++ toolchain.
npmRebuild: false
# So the binaries come from npm as it installed them; a build for another architecture stops.
beforePack: ./scripts/before-pack.mjs
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  # The install directory is fixed (see build/installer.nsh): the app goes to <drive>\LinkBot\app
  # and the data to <drive>\LinkBot\data beside it. The user does not choose it.
  # Turning this off also drops the directory page, and with it the sub-folder that
  # electron-builder would otherwise append to the chosen path.
  allowToChangeInstallationDirectory: false
  include: build/installer.nsh
  installerLanguages: [zh_CN, en_US]
  multiLanguageInstaller: true
mac:
  # A zip, not a dmg: macOS 26 calls a downloaded unsigned dmg damaged and will not open it (#351).
  target: zip
  # Ad-hoc signing seals the bundle; no Developer ID or notarization.
  identity: '-'
  hardenedRuntime: false
  icon: assets/icon.png
  category: public.app-category.productivity
linux:
  # One AppImage runs on every distribution and updates itself; the deb is for Debian/Ubuntu,
  # where it avoids Ubuntu 24.04's AppArmor question of an AppImage and adds a menu entry.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # The binary and the deb's menu entry take this name; productName has a space, which a
  # terminal command should not have.
  executableName: linkbot
  # A deb needs a maintainer; package.json's author has no email, so it goes here.
  maintainer: Fei2411 <https://github.com/Fei2411>
  # Links the running window to the menu entry (WM_CLASS = app id).
  syncDesktopName: true
  icon: assets/icon.png
  category: Utility
# Where the installed app looks for updates (app-update.yml in the package). The build writes
# latest.yml beside the installer; the release workflow attaches both to the GitHub release,
# so the build itself never publishes (--publish never).
publish:
  provider: github
  owner: Fei2411
  repo: DS-Bot
