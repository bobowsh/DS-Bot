# The app id names the Windows uninstall entry and the single-instance lock: it is a technical
# identifier, not a name the user sees, so it stays as it is.
appId: io.github.fei2411.deepseekbot
productName: LinkBot
copyright: Copyright 2026 Fei2411 and the DS Bot contributors
artifactName: LinkBot-${version}-${os}-${arch}.${ext}
directories:
  output: dist-pack
files:
  - package.json
  - src/**
  - assets/**
  # The LibreOffice engine goes beside the app instead (extraResources).
  - '!node_modules/@deepseek-ai/libreoffice-kit-*{,/**/*}'
# The Host runs pnpm as a separate Node process to install plugins, and the Office payload's
# plain Node runs the LibreOffice Kit CLI: both must be plain files outside the asar.
asarUnpack:
  - node_modules/pnpm/**
  - node_modules/@deepseek-ai/libreoffice-kit/**
  # The payload Node cannot read office.js through the asar.
  - node_modules/ds-bot/office.js
  # Automatic unpacking misses versioned Linux libraries such as libvips-cpp.so.8.18.7.
  - node_modules/@img/sharp*/**
  # The signed "DSH Computer Use" helper and the Cua Driver binaries are programs;
  # inside the asar they would not run, and an ad-hoc re-sign would lose DeepSeek's
  # Developer ID signature (mac.signIgnore below keeps it).
  - node_modules/@deepseek-ai/dsh-experimental-cua-macos/**
  - node_modules/@trycua/cua-driver*/**
# The Office payload that scripts/prepare-runtime.mjs writes in beforePack (see package.json's
# `runtime` script). build/ is not in `files`, so nothing of it lands inside the asar.
extraResources:
  - from: build/runtime/primary-runtime
    to: primary-runtime
  - from: build/runtime/office-skills
    to: office-skills
  # File previews start the LibreOffice engine, a program in the engine package that the kit
  # resolves. Electron cannot start a program by a path inside the asar, even an unpacked one
  # (#679). Out here the engine is plain files, and Node's lookup from the kit inside the asar
  # goes up from app.asar/node_modules to resources/node_modules and finds it.
  - from: node_modules/@deepseek-ai
    to: node_modules/@deepseek-ai
    filter: ['libreoffice-kit-*/**']

  # The factory seed team travels as a plain directory under the app's resources, which is
  # where the running app reads it from (src/factory.mjs uses process.resourcesPath). It stays
  # outside the asar: nothing reads it through the archive.
  - from: resources/factory
    to: factory
# The factory plugins (a DSH home tree: profiles/ds-bot/node_modules), the factory skills and
# the factory list travel in the data directory beside the program, as plain folders. The
# installer moves profiles/, skills/ and factory/ to the data home beside the program
# (build/installer.nsh); when that fails the first start reads the tree from here.
extraFiles:
  - from: build/data
    to: data
# node-pty, sharp and koffi ship prebuilt binaries for each platform. A rebuild would compile
# node-pty from source and needs a C++ toolchain.
npmRebuild: false
# So the binaries come from npm as it installed them; a build for another architecture stops.
beforePack: ./scripts/before-pack.mjs
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
nsis:
  # Preserve the GUID derived from the legacy appId so installed copies upgrade in place.
  guid: 32c46dfc-ed78-5d41-85a4-a3c7f083f2e0
  oneClick: false
  perMachine: false
  allowElevation: false
  # The install directory is the one the user picks on the directory page, and the
  # page starts at <drive>\LinkBot\app (see build/installer.nsh): the app goes there
  # and the data to <drive>\LinkBot\data beside it. The chosen path is used as it
  # is; the product-name sub-folder electron-builder would append is kept away by
  # the installer script.
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  installerLanguages: [zh_CN, en_US]
  multiLanguageInstaller: true
mac:
  # A zip, not a dmg: macOS 26 calls a downloaded unsigned dmg damaged and will not open it (#351).
  target: zip
  # Ad-hoc signing seals the bundle; no Developer ID or notarization.
  identity: '-'
  # The DSH helper keeps the signature it was notarized with; the rest is ours to seal.
  signIgnore:
    - 'DSH Computer Use\.app'
  hardenedRuntime: false
  icon: assets/icon.png
  category: public.app-category.productivity
  # Without this key macOS registers no Local Network entry for the app and
  # blocks LAN connections from tool processes outright ("No route to host").
  extendInfo:
    NSLocalNetworkUsageDescription: DS Bot runs commands that connect to devices on your local network.
linux:
  # The Linux Host uses the payload's plain Node, which cannot read asar archives.
  asar: false
  # One AppImage runs on every distribution with glibc 2.28 or newer and updates itself; the deb is for Debian/Ubuntu,
  # where it avoids Ubuntu 24.04's AppArmor question of an AppImage and adds a menu entry.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # The binary and the deb's menu entry take this name; productName has a space, which a
  # terminal command should not have.
  executableName: linkbot
  # A deb needs a maintainer; package.json's author has no email, so it goes here.
  maintainer: Fei2411 <https://github.com/Fei2411>
  # Links the running window to the menu entry (WM_CLASS = app id).
  syncDesktopName: true
  icon: assets/icon.png
  category: Utility
# Let apt replace the legacy deb instead of leaving two installed applications.
deb:
  fpm: ['--replaces', 'deepseek-bot', '--conflicts', 'deepseek-bot'] # legacy package
# Where the installed app looks for updates (app-update.yml in the package). The build writes
# latest.yml beside the installer; the release workflow attaches both to the GitHub release,
# so the build itself never publishes (--publish never).
publish:
  provider: github
  owner: Fei2411
  repo: DS-Bot
